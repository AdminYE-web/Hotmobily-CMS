    - generic [ref=f7e546]:
      - generic [ref=f7e547] [cursor=pointer]: 当店アクキーの保護フィルムの詳細をご案内！
      - generic [ref=f7e552]:
        - img "アクキーのデザインの印刷を保護フィルムでしっかりガード！" [ref=f7e553]
        - paragraph [ref=f7e554]: 当店のアクリルキーホルダーは、印刷面の全面をPETフィルムで保護します。印刷部分だけを保護するのではなく、面全体を透明シートで保護しますので、自然な仕上がりのアクリルキーホルダーです。鍵や金属物がアクリルキーホルダーに当たっても、印刷面には直接触れないため、印刷が剥がれることがありません。保護用のPETフィルムの厚さはたった0.2mm。フィルムの存在にさえ気づかない厚さです。
        - link "保護フィルムの詳細" [ref=f7e555] [cursor=pointer]:
          - /url: https://hotmobily.jp/products/acrylic/filmcoating
    - generic [ref=f7e558]:
      - generic [ref=f7e559] [cursor=pointer]: 当店アクキーのCNC加工の詳細をご案内！
      - generic [ref=f7e564]:
        - img "ホットモバイリーのオリジナルアクキーはなめらかな仕上がりのCNCカット！"
        - paragraph [ref=f7e565]: とても細かなことですが、当店のこだわりのひとつとして、アクリルキーホルダーのCNC加工があります。アクリルのエッジのカットには通常レーザーが使用され、カットの後に小さな突起ができてしまい、触ったときに違和感があります。しかし、当店のアクリルキーホルダーは、エッジのカットにレーザーではなくCNC加工機を使用し、全ての製品の面取りをしています。このため、触れても違和感のないなめらかなカット面に仕上がります。
        - link "CNC加工の詳細" [ref=f7e566] [cursor=pointer]:
          - /url: https://hotmobily.jp/products/acrylic/roundededge
    - generic [ref=f7e569]:
      - generic [ref=f7e570] [cursor=pointer]: 当店のアクキーは安心・安価・高品質の自社生産！
      - generic [ref=f7e575]:
        - img "ホットモバイリーのオリジナルアクキーは完全自社生産！"
        - paragraph [ref=f7e576]: アクリルキーホルダーを含め、当店のアクリル製品はすべて自社生産です。デザインの印刷、アクリル板のカット、包装まですべて自社工場で完結しています。自社生産のためマージンなどが発生せず、お客様のお求めの製品を低コストで製作することができます。製品のクオリティにも責任をもってこだわっております。お客様のデザインを活かした高品質のアクリルキーホルダー（アクキー）をお届けいたします。
        - link "自社生産の詳細" [ref=f7e577] [cursor=pointer]:
          - /url: https://hotmobily.jp/products/acrylic/ownfactory
    - generic [ref=f7e580]:
      - generic [ref=f7e581] [cursor=pointer]: アクリルキーホルダーについてのFAQ
      - generic [ref=f7e586]:
        - generic [ref=f7e587]:
          - paragraph [ref=f7e589]: Q1. オリジナルデザインのアクリルキーホルダーを製作できますか？
          - paragraph [ref=f7e591]: A1. はい、可能です。お客様のデザインデータを元にオリジナルのアクリルキーホルダーを製作いたします。
        - generic [ref=f7e592]:
          - paragraph [ref=f7e594]: Q2. 最低注文数は何個からですか？
          - paragraph [ref=f7e596]: A2. 1個からご注文いただけます。小ロットでもお気軽にご注文ください。
        - generic [ref=f7e597]:
          - paragraph [ref=f7e599]: Q3. 印刷はどのように保護されていますか？
          - paragraph [ref=f7e601]: A3. 印刷面を透明フィルムで保護しており、印刷が露出しないため、剥がれたり傷ついたりしません。アクキーをいつまでに大切にするホットモバイリー独自の製作方法です。
        - generic [ref=f7e602]:
          - paragraph [ref=f7e604]: Q4. アクリルのカット方法について教えてください。
          - paragraph [ref=f7e606]: A4. CNCカットを採用しており、レーザーカットと比較しエッジが滑らかで手触りの良い仕上がりとなっています。
        - generic [ref=f7e607]:
          - paragraph [ref=f7e609]: Q5. 片面印刷と両面印刷の違いは何ですか？
          - paragraph [ref=f7e611]: A5. 片面印刷では、製品の裏面には白押さえが見えます。両面印刷は、製品の表面も裏面もオリジナルデザインの印刷が見えます。左側の写真が片面印刷のアクリルキーホルダーの裏面、右側の写真が両面印刷のアクリルキーホルダーの裏面です。両面印刷は裏面にもデザインを入れられることがわかるかと思います。
        - generic [ref=f7e612]:
          - paragraph [ref=f7e614]: Q6. どのようなアタッチメントを選択できますか？
          - paragraph [ref=f7e616]:
            - text: A6. ボールチェーン、キーリングなどのアタッチメントをご用意しております。ゴールドもございます。詳細は
            - link "アタッチメント欄" [ref=f7e617] [cursor=pointer]:
              - /url: https://hotmobily.jp/products/acrylic/#attachments
            - text: をご覧ください。
        - generic [ref=f7e618]:
          - paragraph [ref=f7e620]: Q7. 製作料金はどのくらいかかりますか？
          - paragraph [ref=f7e622]:
            - text: A7. 価格はサイズや数量によって異なります。例えば、50mm×50mmサイズの1個の価格は990円（税込）です。詳細は
            - link "価格表" [ref=f7e623] [cursor=pointer]:
              - /url: https://hotmobily.jp/products/acrylic/#price
            - text: をご参照ください。
        - generic [ref=f7e624]:
          - paragraph [ref=f7e626]: Q8. 台紙の印刷はできますか？
          - paragraph [ref=f7e628]: A8. はい、既製品の台紙50種類から選択するか、オリジナルデータを入稿いただくことも可能です。
        - generic [ref=f7e629]:
          - paragraph [ref=f7e631]: Q9. 注文後のキャンセルや変更は可能ですか？
          - paragraph [ref=f7e633]: A9. 製作開始前であれば可能です。製作開始後のキャンセル・変更は対応できませんので、ご注意ください。尚、試作品をご注文の場合、量産時に色味修正をご希望の場合、営業担当にご連絡ください。
        - generic [ref=f7e634]:
          - paragraph [ref=f7e636]: Q10. 納期はどのくらいかかりますか？
          - paragraph [ref=f7e638]:
            - text: A10. 6営業日または10営業日から選択可能です。土日祝日及び工場不稼働日は営業日としてカウントされませんのでご注意ください。営業日カレンダーは
            - link "ご利用ガイド（配送と納期）" [ref=f7e639] [cursor=pointer]:
              - /url: https://hotmobily.jp/guide/delivery.php
            - text: にてご確認頂けます。
